# Secret scan. Two modes:
#   push/PR       - scans only the new commits (fast, blocks the merge)
#   workflow_dispatch / weekly - scans the FULL history
# GitHub-native secret scanning is not available on mafas-auto private repos
# (personal account, no Advanced Security), so this is the replacement.

name: secret-scan

on:
  push:
    # Four mafas-auto repos still default to master - list both, do not assume main.
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan entire git history'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSfL -o gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar xzf gl.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps values out of the log. Findings go to the job summary rather than an
      # artifact: artifact storage is a shared quota and it has been full before.
      - name: Scan
        id: scan
        run: |
          set -uo pipefail
          ARGS="--redact --no-banner --exit-code 0 --report-format json --report-path gitleaks.json"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --log-opts="${{ github.event.pull_request.base.sha }}..HEAD" $ARGS .
          else
            gitleaks git $ARGS .
          fi
          N=$(jq 'length' gitleaks.json)
          echo "count=$N" >> "$GITHUB_OUTPUT"
          {
            echo "## gitleaks: $N finding(s)"
            if [ "$N" -gt 0 ]; then
              echo
              echo '| rule | file | line | commit | date |'
              echo '|---|---|---|---|---|'
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:8]) | \(.Date[0:10]) |"' gitleaks.json
              echo
              echo 'Values are redacted by design. Remediation order: **rotate first**, then clean the'
              echo 'working tree, then rewrite history only if the repo is public or the secret cannot'
              echo 'be rotated. See `System/reference/credential-doctrine.md`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$N" -eq 0 ]
