# Secret scan. Two modes:
#   push/PR       - scans only the new commits (fast, blocks the merge)
#   workflow_dispatch / weekly - scans the FULL history
# GitHub-native secret scanning is not available on mafas-auto private repos
# (personal account, no Advanced Security), so this is the replacement.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan entire git history'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSfL -o gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar xzf gl.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        run: |
          set -euo pipefail
          ARGS="--redact --no-banner --report-format sarif --report-path gitleaks.sarif"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --log-opts="${{ github.event.pull_request.base.sha }}..HEAD" $ARGS .
          else
            gitleaks git $ARGS .
          fi

      # --redact means the artifact carries locations, never values.
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
