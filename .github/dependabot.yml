# Dependency updates: one pull request per repository per week, all ecosystems together, patch and minor only.
# Major upgrades are planned work: ignored here, still covered by security alerts and security updates.
# Own repos merge the pull request automatically after green checks (vault: Automatizace/uklid-zavislosti/FLOW.md);
# a repo without CI checks is never merged. Standard: boilerplate README, section Dependencies.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - "/"
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
